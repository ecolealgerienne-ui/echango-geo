# Stack echango-geo — LOCAL (développement, bancs de vérification).
#
# Autonome : réseau bridge créé par ce fichier, ports publiés sur l'hôte,
# aucune dépendance à `echango_network` ni à Traefik. C'est ce fichier que
# `docker compose` lit par défaut.
#
# Le pendant production — réseau externe partagé, aucun port publié — est
# dans docker-compose.prod.yml.
#
# Lancer :
#   cp .env.example .env          # au minimum un GEO_INTERNAL_TOKEN quelconque
#   docker compose up -d          # le 1er démarrage importe l'extrait DZ (long)
#   docker compose logs -f geo-nominatim   # suivre l'import
#
# Bancs, une fois `geo-nominatim` sain :
#   cd scripts && GEO_INTERNAL_TOKEN=<celui du .env> ./test-geocode-search.sh
#
# `name:` distinct du fichier prod pour que les deux stacks ne partagent
# jamais le volume Nominatim.
name: echango-geo-local

services:
  geo-api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      geo-nominatim:
        condition: service_healthy
    env_file: [.env]
    environment:
      # Le conteneur joint Nominatim par le nom de service du réseau interne,
      # pas par le port publié sur l'hôte.
      NOMINATIM_INTERNAL_URL: http://geo-nominatim:8080
    ports:
      # Cible des bancs : http://localhost:3000
      - '${GEO_API_HOST_PORT:-3000}:3000'
    networks: [geo]

  geo-nominatim:
    image: mediagis/nominatim:4.5
    restart: unless-stopped
    environment:
      PBF_URL: https://download.geofabrik.de/africa/algeria-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/africa/algeria-updates/
      NOMINATIM_PASSWORD: ${NOMINATIM_DB_PASSWORD:-nominatim}
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
    ports:
      # Pratique pour inspecter Nominatim directement pendant le dev ; sans
      # incidence sur le service, qui passe par le réseau interne.
      - '${NOMINATIM_HOST_PORT:-8088}:8080'
    networks: [geo]
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080/status.php || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30m

networks:
  geo:

volumes:
  nominatim_data:
